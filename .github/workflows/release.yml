name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-cli:
    name: Build sd-plugins CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CLI
        run: cargo build --release -p sd-plugins-cli
      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: sd-plugins-cli
          path: target/release/sd-plugins

  # Linux x64: tar.gz + deb + rpm + appimage
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    needs: build-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxdo-dev libappindicator3-dev libpulse-dev \
            rpm squashfs-tools dpkg-dev fakeroot
      - uses: actions/download-artifact@v4
        with:
          name: sd-plugins-cli
      - name: Make CLI executable
        run: chmod +x sd-plugins
      - name: Build web
        run: cd web && npm install && npm run build && cd ..
      - name: Build everything
        run: |
          ./sd-plugins build --release --with-web --with-core
          ./sd-plugins pkg --version "${GITHUB_REF_NAME#v}" --platform linux-x64 --formats tar.gz,deb,rpm,appimage
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamdeck-linux-x64
          path: |
            releases/*/linux-x64/*.tar.gz
            releases/*/linux-x64/*.deb
            releases/*/linux-x64/*.rpm
            releases/*/linux-x64/*.AppImage
            releases/*/linux-x64/checksums-sha256.txt
            releases/*/linux-x64/sbom.spdx.json

  # Linux arm64: tar.gz + deb (no rpm on Ubuntu aarch64 runners; can be added via cross build later)
  build-linux-arm64:
    name: Build Linux arm64
    runs-on: ubuntu-latest
    needs: build-cli
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cross-compilation tools
        run: |
          sudo dpkg --add-architecture arm64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          elif [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          fi
          printf '%s\n' \
            "Types: deb" \
            "Architectures: arm64" \
            "URIs: http://ports.ubuntu.com/ubuntu-ports" \
            "Suites: noble noble-updates noble-backports noble-security" \
            "Components: main restricted universe multiverse" \
            "Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg" \
            | sudo tee /etc/apt/sources.list.d/arm64-ports.sources > /dev/null
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libgtk-3-dev:arm64 libappindicator3-dev:arm64 libxdo-dev:arm64 libglib2.0-dev:arm64 libpulse-dev:arm64 \
            dpkg-dev fakeroot
      - uses: actions/download-artifact@v4
        with:
          name: sd-plugins-cli
      - name: Make CLI executable
        run: chmod +x sd-plugins
      - name: Build web
        run: cd web && npm install && npm run build && cd ..
      - name: Build everything
        run: |
          PKG_CONFIG_ALLOW_CROSS=1 \
          PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH \
            ./sd-plugins build --release --target aarch64-unknown-linux-gnu --with-web --with-core
          ./sd-plugins pkg --version "${GITHUB_REF_NAME#v}" --platform linux-arm64 --formats tar.gz,deb
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamdeck-linux-arm64
          path: |
            releases/*/linux-arm64/*.tar.gz
            releases/*/linux-arm64/*.deb
            releases/*/linux-arm64/checksums-sha256.txt
            releases/*/linux-arm64/sbom.spdx.json

  # Windows x64: zip + msi + nsis
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    needs: build-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: sd-plugins-cli
      - name: Install WiX + NSIS
        run: |
          choco install --no-progress wixtoolset nsis -y
          # Ensure WiX + NSIS are on PATH for this step and subsequent ones
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH
          echo "C:\Program Files (x86)\NSIS\Bin" >> $env:GITHUB_PATH
      - name: Build web
        run: cd web && npm install && npm run build
      - name: Build everything
        shell: pwsh
        run: |
          .\sd-plugins.exe build --release --with-web --with-core
          .\sd-plugins.exe pkg --version "${{ github.ref_name }}" --platform windows-x64 --formats zip,msi,nsis
      - name: Sign binaries (optional)
        if: env.WINDOWS_CERT_BASE64 != ''
        shell: pwsh
        run: |
          # Decode cert from secret
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
          $pfxPath = "$env:TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          # Sign the EXEs and DLLs in the staged payload
          Get-ChildItem -Path "target\packaging\windows-x64\stage" -Recurse -Include *.exe,*.dll | ForEach-Object {
            & signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfxPath /p "$env:WINDOWS_CERT_PASSWORD" $_.FullName
          }
          # Re-package after signing
          .\sd-plugins.exe pkg --version "${{ github.ref_name }}" --platform windows-x64 --formats zip,msi,nsis
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamdeck-windows-x64
          path: |
            releases/*/windows-x64/*.zip
            releases/*/windows-x64/*.msi
            releases/*/windows-x64/*.exe
            releases/*/windows-x64/checksums-sha256.txt
            releases/*/windows-x64/sbom.spdx.json

  # Windows arm64: zip only (no MSI cross-build for arm64 in CI yet)
  build-windows-arm64:
    name: Build Windows arm64
    runs-on: windows-latest
    needs: build-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: sd-plugins-cli
      - name: Build web
        run: cd web && npm install && npm run build
      - name: Build everything
        run: |
          rustup target add aarch64-pc-windows-msvc
          .\sd-plugins.exe build --release --target aarch64-pc-windows-msvc --with-web --with-core
          .\sd-plugins.exe pkg --version "${{ github.ref_name }}" --platform windows-arm64 --formats zip
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamdeck-windows-arm64
          path: |
            releases/*/windows-arm64/*.zip
            releases/*/windows-arm64/checksums-sha256.txt
            releases/*/windows-arm64/sbom.spdx.json

  # macOS arm64: tar.gz + dmg + pkg
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    needs: build-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: sd-plugins-cli
      - name: Make CLI executable
        run: chmod +x sd-plugins
      - name: Build web
        run: cd web && npm install && npm run build
      - name: Build everything
        run: |
          ./sd-plugins build --release --with-web --with-core
          ./sd-plugins pkg --version "${{ github.ref_name }}" --platform macos-arm64 --formats tar.gz,dmg,pkg
      - name: Sign + notarize (optional)
        if: env.MACOS_CERT_BASE64 != ''
        run: |
          # Decode .p12 from secret
          mkdir -p ~/private_keys
          echo "$MACOS_CERT_BASE64" | base64 --decode > ~/private_keys/cert.p12
          # Create a temporary keychain for signing
          KEYCHAIN=build.keychain
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" $KEYCHAIN
          security import ~/private_keys/cert.p12 -k $KEYCHAIN -P "$MACOS_CERT_PASSWORD" -A -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN
          # Sign everything
          find target/packaging/macos-arm64/stage -type f \( -name "sd-core" -o -name "*.dylib" \) -exec \
            codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" {} \;
          # Re-package after signing
          ./sd-plugins pkg --version "${{ github.ref_name }}" --platform macos-arm64 --formats tar.gz,dmg,pkg
          # Notarize the .dmg and .pkg
          for f in releases/*/macos-arm64/*.dmg releases/*/macos-arm64/*.pkg; do
            ditto -c -k --sequesterRsrc --keepParent "$f" "${f}.zip"
            xcrun notarytool submit "${f}.zip" \
              --apple-id "$MACOS_APPLE_ID" \
              --password "$MACOS_APP_PASSWORD" \
              --team-id "$MACOS_TEAM_ID" \
              --wait
            xcrun stapler staple "$f"
            rm "${f}.zip"
          done
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamdeck-macos-arm64
          path: |
            releases/*/macos-arm64/*.tar.gz
            releases/*/macos-arm64/*.dmg
            releases/*/macos-arm64/*.pkg
            releases/*/macos-arm64/checksums-sha256.txt
            releases/*/macos-arm64/sbom.spdx.json

  # macOS x64: tar.gz + dmg + pkg
  build-macos-x64:
    name: Build macOS x64
    runs-on: macos-latest
    needs: build-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: sd-plugins-cli
      - name: Make CLI executable
        run: chmod +x sd-plugins
      - name: Build web
        run: cd web && npm install && npm run build
      - name: Build everything
        run: |
          rustup target add x86_64-apple-darwin
          ./sd-plugins build --release --target x86_64-apple-darwin --with-web --with-core
          ./sd-plugins pkg --version "${{ github.ref_name }}" --platform macos-x64 --formats tar.gz,dmg,pkg
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamdeck-macos-x64
          path: |
            releases/*/macos-x64/*.tar.gz
            releases/*/macos-x64/*.dmg
            releases/*/macos-x64/*.pkg
            releases/*/macos-x64/checksums-sha256.txt
            releases/*/macos-x64/sbom.spdx.json

  # Linux: also sign .deb and .rpm packages with GPG if a key is available
  sign-linux:
    name: Sign Linux packages
    runs-on: ubuntu-latest
    needs: [build-linux-x64, build-linux-arm64]
    if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: streamdeck-linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: streamdeck-linux-arm64
      - name: Import GPG key
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import -
          echo "$GPG_PASSPHRASE" | gpg --batch --passphrase-fd 0 --pinentry-mode loopback --yes --sign-key "$GPG_KEY_ID" || true
      - name: Sign .deb
        run: |
          for deb in streamdeck-linux-*/releases/*/linux-*/*.deb; do
            [ -f "$deb" ] || continue
            dpkg-sig --sign builder -k "$GPG_KEY_ID" "$deb"
          done
      - name: Sign .rpm
        run: |
          for rpm in streamdeck-linux-*/releases/*/linux-*/*.rpm; do
            [ -f "$rpm" ] || continue
            rpm --addsign "$rpm"
          done
      - name: Re-upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamdeck-linux-x64
          path: streamdeck-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: streamdeck-linux-arm64
          path: streamdeck-linux-arm64
    env:
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}

  release:
    name: Publish GitHub Release
    needs:
      - build-linux-x64
      - build-linux-arm64
      - build-windows-x64
      - build-windows-arm64
      - build-macos-arm64
      - build-macos-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Flatten artifact directories
        run: |
          mkdir -p release-staging
          for d in streamdeck-*; do
            find "$d" -type f -exec cp --parents {} release-staging/ \;
          done
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-staging/**/*
          generate_release_notes: true
